name: 每日同步机场查数据

on:
  schedule:
    # UTC 16:30 = 北京时间 0:30,主站数据当天变更后次日生效
    - cron: '30 16 * * *'
  workflow_dispatch: {} # 允许在 Actions 页手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 拉取主站数据并生成 README
        run: node scripts/build-readme.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化,跳过提交"
          else
            git commit -m "sync: 同步机场查数据 $(date -u +%Y-%m-%d)"
            git push
          fi
